# Dataset information for the ValEnsPy package

# Format

# machine:
#    dataset_name:
#       root: <path_to_root>
#       pattern: <path_to_pattern>
#       meta_data: #Additional relevant metadata if not present in the filename which are required for unique identification
#         source_id: <source_id> #Assumed to be the same as the dataset_name
#         activity_id: <activity_id>
#         domain_id: <domain_id>
#         frequency: <frequency>
#         resolution: <resolution>
#         version: <version>
#         experiment_id: <experiment_id>

# Ideally, variable_id and time_period (or start_year, end_year, year, yearmonthday) should be in the filename.
# If not please also fill in the presumably shared variables and time_period in each file in the meta_data section.

hortense:
  ERA5: #Note that there is an aggregation variable here! What to do with this? This is messy as it can not be uniquely identified by the filename!
    root: /dodrio/scratch/projects/2022_200/external/era5/
    pattern: <domain_id>/<variable_id>/<frequency>/<variable_id_2>_era5_<domain_id_2>_<frequency_2>_<aggregation>_<time_period>.nc
    meta_data:
      source_id: "ERA5"
      source_type: "reanalysis"
      experiment_id: "reanalysis"
      version: "ERA5.0"
      resolution: "0.25°"
      institution_id: "ECMWF"
      time_format: "%Y"   

  ERA5-Land: #Note that there is an aggregation variable here! What to do with this? This is messy as it can not be uniquely identified by the filename!
    root: /dodrio/scratch/projects/2022_200/external/era5-land/
    pattern: <domain_id>/<variable_id>/<frequency>/<variable_id2>_era5-land_<domain_id_2>_<frequency_2>_<aggregation>_<time_period>.nc
    meta_data:
      source_id: "ERA5-Land"
      source_type: "reanalysis"
      experiment_id: "reanalysis"
      version: "ERA5-Land"
      resolution: "0.1°"
      institution_id: "ECMWF"
      time_format: "%Y"
      
  EOBS: #Note that there is an aggregation variable here! What to do with this?
    root: /dodrio/scratch/projects/2022_200/external/eobs/
    pattern: <resolution>/<variable_id>_ens_<aggregation>_<resolution2>_reg_<version>.nc
    meta_data:
      source_id: "EOBS"
      source_type: "observations"
      domain_id: "Europe"
      experiment_id: "observations"
      frequency: "daily"
      time_period_start: "1950"
      time_period_end: "2023"
      time_format: "%Y"
      
  CLIMATE_GRID:
    root: /dodrio/scratch/projects/2022_200/external/climate_grid/regridded/
    pattern: <domain_id>/<variable_id>_CLIMATE_GRID_<time_period_start>_<time_period_end>_<frequency>_<domain_id2>_<resolution>.nc
    meta_data:
      source_id: "CLIMATE_GRID"
      source_type: "observations"
      experiment_id: "observations"
      version: "v1"
      resolution: "~5km"
      institution_id: "RMIB"
      time_format: "%Y"

  RADCLIM: #TODO move to a shared location?
    root: /dodrio/scratch/projects/2022_200/project_output/RMIB-UGent/vsc45263_wout/data/RADCLIM
    pattern: <year>/RADCLIM_<variable_id>_<time_period>_<frequency>.nc
    meta_data:
      source_id: "RADCLIM"
      source_type: "satellite"
      domain_id: "Belgium"
      experiment_id: "observations"
      version: "v1"
      frequency: "daily"
      resolution: "~1km"
      institution_id: "RMIB"
      time_format: "%Y%m%d"

kili:
  ERA5:
  ERA5-Land:
  EOBS:
  CLIMATE_GRID: /mnt/HDS_CLIMATE/CLIMATE/CLIMATE_GRID/
